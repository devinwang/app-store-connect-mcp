name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Extract release notes for this version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Pull the section for this version from CHANGELOG.md into a file.
          # We write to a file (not a workflow output) so the content never
          # passes through shell interpolation — release notes contain
          # backticks, brackets, parentheses, and other shell metachars.
          awk -v ver="$version" '
            BEGIN { capturing=0 }
            $0 ~ "^## \\[" ver "\\]" { capturing=1; print; next }
            capturing && $0 ~ "^## \\[" { capturing=0 }
            capturing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release $tag" > /tmp/release-notes.md
          fi
          echo "=== Release notes preview ==="
          head -50 /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
