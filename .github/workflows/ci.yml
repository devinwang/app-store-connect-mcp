name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify no credentials in build output
        run: |
          # Real ASC key IDs are exactly 10 upper-case alphanumeric chars.
          # The {10} quantifier avoids false positives on placeholders
          # like `AuthKey_<KEYID>.p8` or `AuthKey_XXX.p8` in docs.
          if grep -rE "BEGIN (EC |RSA )?PRIVATE KEY|AuthKey_[A-Z0-9]{10}\.p8" dist/ 2>/dev/null; then
            echo "::error::Private key material found in dist/"
            exit 1
          fi
